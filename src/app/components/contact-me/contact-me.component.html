<div class="container contact reveal">
  <div class="contact-head">
    <span class="eyebrow">Contact</span>
    <h2 class="section-title">Let's work together</h2>
    <p class="contact-sub">
      Have a project in mind or just want to say hello? I'm always open to new
      opportunities and conversations.
    </p>
  </div>

  <ul class="contact-list">
    <li *ngFor="let item of items">
      <span class="contact-label">{{ item.label }}</span>
      <a *ngIf="item.href; else plain" [href]="item.href" target="_blank" rel="noopener" class="contact-value link">
        {{ item.value }}
      </a>
      <ng-template #plain>
        <span class="contact-value">{{ item.value }}</span>
      </ng-template>
    </li>
  </ul>
</div>
