<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="footer-name">Rezo Alikadze</span>
      <span class="footer-role">Software Developer</span>
    </div>

    <nav class="footer-socials">
      <a *ngFor="let s of socials" [href]="s.url" target="_blank" rel="noopener">{{ s.name }}</a>
    </nav>
  </div>

  <div class="container footer-bottom">
    <p>© {{ currentYear }} Rezo Alikadze. All rights reserved.</p>
    <p>Built with Angular &amp; TypeScript.</p>
  </div>
</footer>
