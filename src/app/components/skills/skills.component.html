<div class="container">
  <div class="skills-head reveal">
    <span class="eyebrow">Skills</span>
    <h2 class="section-title">Tools I work with</h2>
    <p class="skills-sub">
      Technologies I use to design, build and ship modern web applications.
    </p>
  </div>

  <div class="skills-groups">
    <div class="skill-group reveal" *ngFor="let group of groups">
      <h3 class="group-title">{{ group.title }}</h3>
      <ul class="chip-list">
        <li class="chip" *ngFor="let skill of group.skills">{{ skill }}</li>
      </ul>
    </div>
  </div>
</div>
