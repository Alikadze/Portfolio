<div class="container">
  <div class="projects-head reveal">
    <span class="eyebrow">Selected work</span>
    <h2 class="section-title">Projects</h2>
    <p class="projects-sub">
      A few products I've designed and built — from CRMs and dashboards to
      gaming platforms and storefronts.
    </p>
  </div>

  <div class="projects-grid">
    <article class="project-card reveal" *ngFor="let project of projects">
      <div class="project-media">
        <img [src]="project.image" [alt]="project.title" loading="lazy" />
      </div>

      <div class="project-body">
        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <ul class="project-tech">
          <li *ngFor="let t of project.tech">{{ t }}</li>
        </ul>

        <div class="project-links">
          <a *ngIf="project.live" [href]="project.live" target="_blank" rel="noopener" class="project-link primary">
            Live demo ↗
          </a>
          <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener" class="project-link">
            Source
          </a>
        </div>
      </div>
    </article>
  </div>
</div>
